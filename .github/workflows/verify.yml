name: verify

# The four commands CLAUDE.md asks for before calling anything done, run by a machine instead of
# by memory. Until this existed, ~170 Konsist rules, 130-odd test files and the migration check
# all depended on a human typing four things in the right order — and the Konsist one silently
# reported a stale pass until #82.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on the same branch is only ever noise, so cancel it. This is the opposite of
# the content workflow, which must never cancel: a half-published edition is worse than a late
# one, while a half-finished check is worth nothing either way.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: konsist · tests · ktlint · migration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A tampered wrapper jar executes arbitrary code in every build that runs it, and this repo
      # is public. One step, checked against the published Gradle checksums.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Each command is its own step, and every one runs even after an earlier failure. Chaining
      # them would report only the first, which is exactly the loop CLAUDE.md warns about: you fix
      # ktlint, push, wait, and only then discover Konsist. They catch different things — ktlint
      # has a history of finding violations across files a narrower run never touches.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop, not grind through four
      # more Gradle invocations.
      - name: Konsist — architecture rules
        run: ./gradlew :konsistTest:test

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew :shared:testAndroidHostTest

      - name: ktlint
        if: ${{ !cancelled() }}
        run: ./gradlew ktlintCheck

      # The odd one out, and the reason it is on the list: a table added to a .sq file without a
      # matching .sqm compiles, runs and passes every other command here. It only breaks on a
      # device that already had the database, and it has shipped that way once.
      - name: Database migration
        if: ${{ !cancelled() }}
        run: ./gradlew :shared:verifyCommonMainAppDatabaseMigration

      # The migration check catches a .sq table with no .sqm. It does not catch the other half of
      # the same mistake: a committed schema snapshot that no longer matches the .sq files, which
      # is what the migration check replays against. Regenerating and diffing is the only way to
      # see it. The snapshot was confirmed byte-identical across repeated regenerations before
      # this step was added — a flaky required check would be worse than none.
      - name: Schema snapshot is current
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :shared:generateCommonMainAppDatabaseSchema
          git diff --exit-code -- shared/src/commonMain/sqldelight/databases/ \
            || { echo "::error::The schema snapshot is stale. Run :shared:generateCommonMainAppDatabaseSchema and commit the .db it writes."; exit 1; }

      # The build already writes ktlint HTML/JSON/checkstyle reports and JUnit XML, and nothing has
      # ever read them. On a red run they are the difference between a log line and the file.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          retention-days: 14
          if-no-files-found: ignore

  # The four commands never compile for Kotlin/Native and never run a test on it, so half of a
  # Multiplatform app was verified by compiling on the other half. Not academic for this code:
  # `formatMoney` rounds a Double via roundToLong and `slotLiveStateAt` divides two Durations and
  # calls .toFloat() — both are where JVM and Native are allowed to disagree.
  #
  # macOS is required to build an iOS target at all, and is free here because the repo is public.
  ios:
    name: ios — compile · commonTest on native
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile the iOS framework
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64

      # The same commonTest sources the JVM already runs, on Native this time. The runner is
      # arm64, which is what iosSimulatorArm64 wants.
      - name: Run commonTest on iOS
        if: ${{ !cancelled() }}
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          retention-days: 14
          if-no-files-found: ignore

  # Nothing in the four commands builds the app. A broken manifest, a missing resource or an R8
  # problem lives entirely in `:androidApp`, which the shared tests never touch.
  android:
    name: android — assemble · lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the debug app
        run: ./gradlew :androidApp:assembleDebug

      # Android Lint sees things ktlint and Konsist cannot: manifest problems, deprecated platform
      # APIs, and accessibility. The last one matters here — the app argues about
      # contentDescription in several places and nothing has ever checked the claim.
      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :androidApp:lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            androidApp/build/reports/**
          retention-days: 14
          if-no-files-found: ignore
